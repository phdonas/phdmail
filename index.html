    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fcfaf7',   // Creme muito claro
                            100: '#f7f2ea',  // Creme suave (fundo quente)
                            200: '#eddcc5',  // Bronze pastel
                            300: '#debfa0',  // Bronze claro

                            100: '#e9eaf0',
                            200: '#c8cbdc',
                            300: '#a8acc8',

                            500: '#676ea0',
                            600: '#525880',
                            700: '#3e4260',
                            800: '#292c40',
                            900: '#1a1c2a',  // Navy escuro primário (Sidebar)
                            950: '#0f1018',  // Super escuro (Fundo principal Dark)
                        }
                    },
                    fontFamily: {
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"DM Sans"', '"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        } catch (_) {}
    </script>
